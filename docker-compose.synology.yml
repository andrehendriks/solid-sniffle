# ============================================================
#  HomeLab Benchmark Center — Synology DSM Container Manager
# ============================================================
# Deploy via DSM > Container Manager > Project > Create
#
# STAP 1: Clone de repo naar de NAS via SSH:
#   git clone https://github.com/andrehendriks/solid-sniffle.git \
#             /volume1/docker/solid-sniffle
#
# STAP 2: Maak een .env aan in die map (zie README).
#
# STAP 3: Maak het project aan in Container Manager met
#   pad = /volume1/docker/solid-sniffle
#   en gebruik dit bestand als compose bestand.
#
# Images worden lokaal gebouwd — geen externe registry nodig.
# PostgreSQL komt van Docker Hub (klein officieel image).
# ============================================================

version: "3.9"

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: homelab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homelab}
      POSTGRES_USER: ${POSTGRES_USER:-homelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homelab} -d ${POSTGRES_DB:-homelab}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - homelab

  # ── Backend (FastAPI) — lokaal gebouwd ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homelab-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homelab}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-homelab}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret}
      NAS_BENCHMARK_PATH: /mnt/nas_bench
      SMB_HOST: ${SMB_HOST:-}
      SMB_SHARE: ${SMB_SHARE:-}
      SMB_USER: ${SMB_USER:-}
      SMB_PASSWORD: ${SMB_PASSWORD:-}
      SMB_DOMAIN: ${SMB_DOMAIN:-WORKGROUP}
      IPERF3_SERVER: ${IPERF3_SERVER:-}
      PING_HOST: ${PING_HOST:-8.8.8.8}
      DNS_HOST: ${DNS_HOST:-8.8.8.8}
      K8S_KUBECONFIG: ${K8S_KUBECONFIG:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /volume1/docker/solid-sniffle/scratch:/mnt/nas_bench
      - /volume1/docker/solid-sniffle/kube:/root/.kube:ro
    ports:
      - "${BACKEND_PORT:-8100}:8000"
    networks:
      - homelab

  # ── Frontend (nginx) — lokaal gebouwd ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://${NAS_IP:-localhost}:${BACKEND_PORT:-8100}
    container_name: homelab-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3100}:80"
    networks:
      - homelab

networks:
  homelab:
    driver: bridge

volumes:
  postgres_data:
